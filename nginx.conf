server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # ── Frontend (React / Vite build)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Core Backend API (Port 8000)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── Static Uploads (from core backend)
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # ── Auth Microservice (Port 8001)
    location /auth-service/ {
        rewrite ^/auth-service/(.*)$ /$1 break;
        proxy_pass http://auth_service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # ── AI Microservice (Port 8002)
    location /ai-service/ {
        rewrite ^/ai-service/(.*)$ /$1 break;
        proxy_pass http://ai_service:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
