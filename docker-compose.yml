version: '3.9'

services:
  # ─────────────────────────────────────────────
  # 1. PostgreSQL Database (with pgvector for HNSW RAG indexing)
  # ─────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: fimms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fimms
      POSTGRES_USER: fimms_user
      POSTGRES_PASSWORD: fimms_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema_postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fimms_user -d fimms"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # 2. Auth Microservice (Port 8001)
  #    Independent Registration & Authentication
  # ─────────────────────────────────────────────
  auth_service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    container_name: fimms-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://fimms_user:fimms_password_2026@db:5432/fimms
      - SECRET_KEY=${SECRET_KEY:-fimms-collector-super-secret-key-2026}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # 3. AI / RAG Microservice (Port 8002)
  #    Gemini (default) + Bedrock (switchable)
  #    pgvector HNSW fast indexing
  # ─────────────────────────────────────────────
  ai_service:
    build:
      context: .
      dockerfile: services/ai_service/Dockerfile
    container_name: fimms-ai
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://fimms_user:fimms_password_2026@db:5432/fimms
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-anthropic.claude-3-haiku-20240307-v1:0}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
    ports:
      - "8002:8002"

  # ─────────────────────────────────────────────
  # 4. Core Backend FastAPI (Port 8000)
  #    Entities, Complaints, Collector Routes, Reports
  # ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fimms-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://fimms_user:fimms_password_2026@db:5432/fimms
      - SECRET_KEY=${SECRET_KEY:-fimms-collector-super-secret-key-2026}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-anthropic.claude-3-haiku-20240307-v1:0}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
    volumes:
      - backend_uploads:/app/backend/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # 5. React Frontend + Nginx (Port 80 / 3000)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: fimms-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_uploads:
